<style>
:root{--p:#2d6a4f;--bd:#e5e9ef;--bg:#f3f6f4}

.pc small{display:block;color:#64748b;font-weight:400;font-size:12px}.pc i{font-style:normal;font-size:11px;background:#e0f2fe;color:#0369a1;padding:1px 7px;border-radius:8px;margin-left:4px}

.di{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px;gap:8px}.di small{display:block;color:#64748b}.di .i{color:#0284c7;font-size:11px}
.ck{display:block;padding:10px 4px;border-bottom:1px solid #f1f5f9;font-size:14px}.ck input{width:auto;margin-right:6px}.ck small{color:#64748b}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 16px;border-radius:24px;display:none;gap:12px;align-items:center;z-index:99;font-size:13px;white-space:nowrap}#toast button{min-height:28px;padding:3px 10px;background:#10b981}
footer{text-align:center;color:#64748b;font-size:12px;padding:14px}

@media print{@page{size:A4 landscape;margin:8mm}body>*:not(#print){display:none!important}body{background:#fff;padding:0}#print{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:9pt}
.ph{display:flex;justify-content:space-between;align-items:center;background:#2d6a4f;color:#fff;padding:6px 12px;border-radius:6px;margin-bottom:5px}.ph h1{margin:0;font-size:13pt;color:#fff}.ph span{font-weight:700}
#print table{width:100%;border-collapse:collapse;table-layout:fixed}#print td,#print th{border:1px solid #cbd5e1;padding:3px 4px;vertical-align:top}#print th{background:#2d6a4f;color:#fff;font-size:8.5pt;width:auto}#print tr>th:first-child{width:10%}
#print ul{list-style:none;margin:0;padding:0}#print li{display:flex;justify-content:space-between;gap:4px;border-bottom:1px dotted #e2e8f0;padding:1px 0}#print li b{white-space:nowrap;color:#166534}
#print em{display:inline-block;background:#fef3c7;color:#b45309;font-size:7.5pt;font-weight:700;padding:0 4px;border-radius:3px;margin-top:2px}.e{text-align:center;color:#cbd5e1}
#print .tt{background:#0f172a}#print .tt2{background:#f8fafc;text-align:center;font-weight:600;font-size:8pt}.cr{text-align:right;font-size:8pt;color:#64748b;margin:4px 0 0}}
</style></head><body>
<div class="w">
<section id="v-home"><h1>🍏 Piano Alimentare</h1>

<button onclick="show('om',0);renamePat()">✏️ Rinomina paziente</button><button onclick="show('om',0);openT()">🎯 Obiettivi giornalieri</button><button onclick="show('om',0);openCopy()">📅 Copia giornata…</button><button onclick="show('om',0);setWeekend()">🍕 Weekend libero</button><button onclick="show('om',0);exportExcel()">📊 Esporta Excel</button><button onclick="show('om',0);printPlan()">📄 PDF / Stampa</button><button class="dg" onclick="show('om',0);delPat()">🗑 Elimina paziente</button></div></div></div>

<div class="g2"><div class="fld"><label>Kcal</label><input id="t_kcal" type="number" inputmode="decimal" oninput="setT('kcal',this.value)"></div><div class="fld"><label>Carboidrati (g)</label><input id="t_carbs" type="number" inputmode="decimal" oninput="setT('carbs',this.value)"></div><div class="fld"><label>Proteine (g)</label><input id="t_pro" type="number" inputmode="decimal" oninput="setT('pro',this.value)"></div><div class="fld"><label>Grassi (g)</label><input id="t_fat" type="number" inputmode="decimal" oninput="setT('fat',this.value)"></div></div></div></div>

<div class="g2"><div class="fld"><label>Stato</label><select id="dS"><option value="">—</option><option>crudo</option><option>cotto</option></select></div><div class="fld"><label>Kcal / 100 g</label><input id="dK" type="number" inputmode="decimal"></div></div>

<div class="sec">Compila da etichetta</div><div class="g2"><select id="ocrL" aria-label="Lingua"><option value="ita+eng">Italiano / Inglese</option><option value="fra+eng">Français</option><option value="spa+eng">Español</option><option value="deu+eng">Deutsch</option><option value="por+eng">Português</option><option value="ita+eng+fra+deu+spa">Multilingua (lento)</option></select><button class="gh" onclick="$('lf').click()">📷 Leggi etichetta</button></div>
<input type="file" id="lf" accept="image/*" hidden onchange="readLabel(this)"><p class="mt" id="ocrS"></p><details style="font-size:11px;margin-bottom:10px"><summary>Testo letto dalla foto</summary><pre id="ocrT" style="white-space:pre-wrap"></pre></details>
<div class="g2"><button class="pr" onclick="saveDb()">Salva</button><button class="rd" id="dDel" onclick="delDb()">Elimina</button></div></div></div>
<div class="ov" id="oe"><div class="md"><div class="mh"><h2>⇄ Equivalenze</h2><button class="gh sm" onclick="show('oe',0)">✖</button></div><div id="eh"></div><div id="el"></div></div></div>
<div class="ov" id="oc"><div class="md"><div class="mh"><h2 id="ct"></h2><button class="gh sm" onclick="show('oc',0)">✖</button></div><div class="g3" style="margin-bottom:6px"><button class="gh sm" onclick="pick(['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì'])">Lun–Ven</button><button class="gh sm" onclick="pick(days)">Tutti</button><button class="gh sm" onclick="pick([])">Nessuno</button></div><div id="cl"></div><button class="pr" style="width:100%;margin-top:12px" onclick="doCopy()">Copia sui giorni selezionati</button></div></div>
<div id="toast"><span id="tm"></span><button onclick="doUndo()">Annulla</button></div><div id="print"></div>
<script>
const days=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'],meals=['Colazione','Spuntino 1','Pranzo','Spuntino 2','Cena'],colors=['#d97706','#0284c7','#15803d','#7c3aed','#1e293b'],MK=['kcal','carbs','pro','fat'];
const $=id=>document.getElementById(id),num=v=>parseFloat(v)||0,r1=v=>Math.round(v*10)/10,val=v=>v?r1(v):'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const T0=()=>({kcal:0,carbs:0,pro:0,fat:0}),emptyData=()=>{const d={};days.forEach(x=>{d[x]={};meals.forEach(m=>d[x][m]=[])});return d};
function fixData(d){const o=emptyData();if(d&&typeof d==='object')days.forEach(x=>meals.forEach(m=>{const a=d[x]&&d[x][m];if(Array.isArray(a))o[x][m]=a.filter(f=>f&&typeof f==='object').map(f=>({name:String(f.name||''),weight:num(f.weight)||'',kcal:num(f.kcal),carbs:num(f.carbs),pro:num(f.pro),fat:num(f.fat),manual:!!f.manual}))}));return o}
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const DEF=[['Avena in fiocchi','crudo',370,66,13,7],['Latte proteico','',55,4.8,7.5,.5],['Petto di pollo','crudo',110,0,23,1.2],['Riso basmati','crudo',350,78,8.5,.8],['Pasta integrale','crudo',345,65,12.5,2],["Olio extravergine d'oliva",'',884,0,0,100],['Mandorle sgusciate','',580,4.5,21,50],['Fesa di tacchino','',105,1,22,1.5]].map(a=>({name:a[0],stato:a[1],kcal:a[2],carbs:a[3],pro:a[4],fat:a[5]}));
let app=load('dietApp'),cur=days[0],copied=null,undo=null,tt;
if(!app||!app.patients){const old=load('dietData'),odb=load('foodDb'),id='p'+Date.now();app={cur:id,patients:old?{[id]:{name:localStorage.getItem('dietName')||'Paziente 1',data:old,targets:T0()}}:{},db:Array.isArray(odb)&&odb.length?odb:DEF}}
function fixApp(){if(!Array.isArray(app.db))app.db=[];if(!app.patients||typeof app.patients!=='object')app.patients={};Object.values(app.patients).forEach(p=>{p.name=String(p.name||'');p.data=fixData(p.data);p.targets=Object.assign(T0(),p.targets);p.free=(p.free&&typeof p.free==='object')?p.free:{}});if(!app.patients[app.cur])app.cur=Object.keys(app.patients)[0]||''}
fixApp();
const P=()=>app.patients[app.cur],D=()=>P().data,isFree=(d,m)=>!!P().free[d+'|'+m],allFree=d=>meals.every(m=>isFree(d,m));
function save(){try{localStorage.setItem('dietApp',JSON.stringify(app))}catch(e){alert('Impossibile salvare nel browser (memoria piena?). Fai un Backup.')}}
function findDb(n){n=norm(n);if(!n)return null;let x=app.db.find(f=>norm(f.name)===n);if(x)return x;if(n.length>=3){const m=app.db.filter(f=>norm(f.name).includes(n));if(m.length===1)return m[0]}return null}
const link=f=>f.name.trim()?findDb(f.name):null;
function calc(f){const d=link(f);if(d&&!f.manual&&num(f.weight)>0){const k=num(f.weight)/100,o={};MK.forEach(x=>o[x]=num(d[x])*k);return o}return{kcal:num(f.kcal),carbs:num(f.carbs),pro:num(f.pro),fat:num(f.fat)}}
function tot(a){const t=T0();a.forEach(f=>{if(!f.name.trim())return;const c=calc(f);MK.forEach(k=>t[k]+=c[k])});return t}
function dayTot(d){const t=T0();meals.forEach(m=>{if(isFree(d,m))return;const x=tot(D()[d][m]);MK.forEach(k=>t[k]+=x[k])});return t}
const L={kcal:'kcal',carbs:'Carbo',pro:'Pro',fat:'Grassi'};
function sync(mi,i){const f=D()[cur][meals[mi]][i],r=$('r'+mi+'_'+i);if(!r)return;const c=calc(f),d=link(f),auto=!f.manual&&d&&num(f.weight)>0;
MK.forEach(k=>{if(auto)f[k]=r1(c[k]);const el=r.querySelector('[data-f='+k+']');if(el&&el!==document.activeElement)el.value=val(c[k])});
const ck=c.carbs*4+c.pro*4+c.fat*9;let b='';
if(!f.name.trim())b=(c.kcal||c.carbs||c.pro||c.fat)?'<span class="w">⚠ senza nome: ignorata nei totali</span>':'';
else if(!d)b='<span class="w">⚠ non in archivio (valori manuali)</span>';
else b=f.manual?'<span class="i">✏️ valori manuali</span>':'<span class="o">✓ archivio'+(d.stato?' · '+esc(d.stato):'')+'</span>';
if(c.kcal>0&&Math.abs(c.kcal-ck)>Math.max(25,c.kcal*.15))b+=' <span class="w">⚠ kcal≠macro ('+ck.toFixed(0)+')</span>';
r.querySelector('.bd').innerHTML=b}
function upd(mi,i,fd,el){const f=D()[cur][meals[mi]][i];
if(fd==='name'){f.name=el.value.trim();const d=link(f);if(d){f.name=d.name;el.value=d.name}else if(!f.manual)MK.forEach(k=>f[k]=0)}
else if(fd==='weight')f.weight=num(el.value)||'';
else{f[fd]=num(el.value);f.manual=true}
sync(mi,i);save();totals()}
function resetF(mi,i){const f=D()[cur][meals[mi]][i];if(!link(f))return alert('Questo alimento non è nell\'archivio: non c\'è nulla da ricalcolare.');f.manual=false;sync(mi,i);save();totals()}
const addFood=mi=>{D()[cur][meals[mi]].push({name:'',weight:'',kcal:0,carbs:0,pro:0,fat:0,manual:false});save();renderMeals()};
const copyF=(mi,i)=>{copied=JSON.parse(JSON.stringify(D()[cur][meals[mi]][i]));renderMeals();toast('Alimento copiato: usa “Incolla” in un pasto')};
const paste=mi=>{if(copied){D()[cur][meals[mi]].push(JSON.parse(JSON.stringify(copied)));save();renderMeals()}};
function delF(mi,i){const a=D()[cur][meals[mi]];undo={a,i,f:a[i]};a.splice(i,1);save();renderMeals();toast('Alimento eliminato',1)}
function doUndo(){if(undo){undo.a.splice(undo.i,0,undo.f);undo=null;save();renderMeals();$('toast').style.display='none'}}
function toast(m,u){$('tm').textContent=m;$('toast').querySelector('button').style.display=u?'':'none';$('toast').style.display='flex';clearTimeout(tt);tt=setTimeout(()=>$('toast').style.display='none',6000)}
function show(id,s){$(id).style.display=s?'flex':'none'}
function openCopy(){$('ct').textContent='Copia il piano di '+cur+' su:';$('cl').innerHTML=days.filter(d=>d!==cur).map(d=>{const n=meals.some(m=>D()[d][m].length);return`<label class="ck"><input type="checkbox" value="${d}"> ${d} <small>${n?'(già compilato: '+dayTot(d).kcal.toFixed(0)+' kcal, verrà sostituito)':'(vuoto)'}</small></label>`}).join('');show('oc',1)}
function pick(a){document.querySelectorAll('#cl input').forEach(c=>c.checked=a.includes(c.value))}
function doCopy(){const s=[...document.querySelectorAll('#cl input:checked')].map(c=>c.value);if(!s.length)return alert('Seleziona almeno un giorno.');const fl=s.filter(d=>meals.some(m=>D()[d][m].length));if(fl.length&&!confirm('Verranno sostituiti i piani già compilati di: '+fl.join(', ')+'. Continuare?'))return;s.forEach(t=>{D()[t]=JSON.parse(JSON.stringify(D()[cur]));meals.forEach(m=>{if(isFree(cur,m))P().free[t+'|'+m]=1;else delete P().free[t+'|'+m]})});save();show('oc',0);totals();toast('Giornata copiata su '+s.length+' giorn'+(s.length>1?'i':'o'))}
let eq=null;

async function exportExcel(){try{const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Piano Alimentare',{views:[{showGridLines:false}]}),G='FF436436',DG='FF5A7338',LG='FFABC28C',BG='FFEBEFDE',b={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}},fill=a=>({type:'pattern',pattern:'solid',fgColor:{argb:a}});

days.forEach(d=>{const t=dayTot(d),r=ws.addRow([d,...meals.map(m=>{if(isFree(d,m))return'🍕 Pasto libero';const a=D()[d][m].filter(f=>f.name.trim());if(!a.length)return'';const x=tot(a);return a.map(f=>(f.weight?f.weight+'g ':'')+f.name).join(' / ')+'\n'+x.pro.toFixed(0)+'g proteine · '+x.kcal.toFixed(0)+' kcal'}),...(allFree(d)?['','','','']:[Math.round(t.kcal),Math.round(t.pro),Math.round(t.carbs),Math.round(t.fat)])]);r.height=60;r.eachCell((c,n)=>{c.border=b;c.alignment={vertical:'middle',horizontal:n>6?'center':'left',wrapText:true};if(n===1)c.fill=fill(LG)})});

[14,30,30,30,30,30,10,14,16,12].forEach((w,i)=>ws.getColumn(i+1).width=w);
saveAs(new Blob([await wb.xlsx.writeBuffer()]),'Piano_Alimentare_'+(P().name||'paziente').trim().replace(/[^\w\-]+/g,'_')+'.xlsx')}catch(e){alert('Errore nella creazione del file Excel: '+e.message)}}
let view='home',editIdx=-1;
function go(v){view=v;['home','plan','db'].forEach(x=>$('v-'+x).hidden=x!==v);if(v==='home')renderHome();if(v==='plan'){renderTop();renderMeals()}if(v==='db')renderDb();window.scrollTo(0,0)}
const renderAll=()=>go(view);
function renderHome(){const ids=Object.keys(app.patients);$('pl').innerHTML=ids.map(id=>{const p=app.patients[id],n=days.filter(d=>meals.some(m=>p.data[d][m].length)).length;return`<button class="pc" onclick="openPat('${id}')"><span><b>${esc(p.name||'Senza nome')}</b><small>${n?n+' giorn'+(n>1?'i':'o')+' compilat'+(n>1?'i':'o'):'Piano vuoto'}</small></span><span>›</span></button>`}).join('')||'<p class="mt">Nessun paziente: creane uno per iniziare.</p>'}
function openPat(id){app.cur=id;cur=days[0];copied=null;undo=null;$('toast').style.display='none';save();go('plan')}
function newPat(){const n=prompt('Nome del nuovo paziente:');if(!n||!n.trim())return;const id='p'+Date.now();app.patients[id]={name:n.trim(),data:emptyData(),targets:T0(),free:{}};openPat(id)}
function delPat(){if(!confirm('Eliminare il paziente "'+P().name+'" e tutto il suo piano? Fai prima un Backup se non sei sicuro.'))return;delete app.patients[app.cur];fixApp();save();go('home')}
function renamePat(){const n=prompt('Nome paziente:',P().name);if(n!=null){P().name=n.trim();save();renderTop()}}
function openT(){MK.forEach(k=>$('t_'+k).value=P().targets[k]||'');show('ot',1)}
function renderTop(){$('pt').textContent=P().name||'Senza nome';$('tabs').innerHTML=days.map(d=>`<button class="tb${d===cur?' on':''}" onclick="cur='${d}';renderTop();renderMeals()">${d.slice(0,3)}</button>`).join('')}
function rowHtml(mi,i,f){const c=calc(f);return`<div class="fr" id="r${mi}_${i}"><div class="cn"><input aria-label="Alimento" autocomplete="off" placeholder="Alimento: inizia a scrivere" value="${esc(f.name)}" oninput="sug(this,${mi},${i})" onfocus="sug(this,${mi},${i})" onblur="setTimeout(sugHide,300)" onchange="upd(${mi},${i},'name',this)"><div class="sg"></div><small class="bd"></small></div><div class="nm"><label class="f"><span>g</span><input type="number" inputmode="decimal" min="0" data-f="weight" value="${f.weight||''}" onchange="upd(${mi},${i},'weight',this)"></label>${MK.map(k=>`<label class="f"><span>${L[k]}</span><input type="number" inputmode="decimal" min="0" step="0.1" data-f="${k}" value="${val(c[k])}" onchange="upd(${mi},${i},'${k}',this)"></label>`).join('')}</div><div class="ca"><button class="b-eq" title="Equivalenze" onclick="openEq(${mi},${i})">⇄</button><button class="gh" title="Copia" onclick="copyF(${mi},${i})">📋</button><button class="gh" title="Ricalcola dall'archivio" onclick="resetF(${mi},${i})">↺</button><button class="b-dl" title="Elimina" onclick="delF(${mi},${i})">❌</button></div></div>`}
const sugHide=()=>document.querySelectorAll('.sg').forEach(b=>b.style.display='none');
function sug(el,mi,i){const q=norm(el.value),box=el.parentNode.querySelector('.sg');document.querySelectorAll('.sg').forEach(b=>{if(b!==box)b.style.display='none'});
const m=app.db.map((x,j)=>({x,j})).filter(o=>!q||norm(o.x.name).includes(q)).sort((a,b)=>(norm(a.x.name).startsWith(q)?0:1)-(norm(b.x.name).startsWith(q)?0:1)||a.x.name.localeCompare(b.x.name)).slice(0,8);
if(!m.length){box.style.display='none';return}
box.innerHTML=m.map(o=>`<div class="si" onclick="pickSug(${mi},${i},${o.j})"><b>${esc(o.x.name)}</b> ${o.x.stato?`<i>${esc(o.x.stato)}</i>`:''}<small>${o.x.kcal} kcal · C ${o.x.carbs} · P ${o.x.pro} · G ${o.x.fat} (per 100 g)</small></div>`).join('');box.style.display='block'}
function pickSug(mi,i,j){const r=$('r'+mi+'_'+i),el=r.querySelector('.cn input');el.value=app.db[j].name;upd(mi,i,'name',el);sugHide();const w=r.querySelector('[data-f=weight]');if(w&&!w.value)w.focus()}
function renderDb(){const q=norm($('dq').value),a=app.db.map((f,i)=>({f,i})).filter(o=>!q||norm(o.f.name).includes(q)).sort((x,y)=>x.f.name.localeCompare(y.f.name));$('dc').textContent=a.length+' aliment'+(a.length===1?'o':'i')+' · valori per 100 g';
$('dbList').innerHTML=a.map(o=>`<button class="pc" onclick="openFood(${o.i})"><span><b>${esc(o.f.name)}</b>${o.f.stato?`<i>${esc(o.f.stato)}</i>`:''}<small>${o.f.kcal} kcal · C ${o.f.carbs} · P ${o.f.pro} · G ${o.f.fat}</small></span><span>›</span></button>`).join('')||'<p class="mt">Nessun alimento trovato.</p>'}
function openFood(i){editIdx=i;const f=i>=0?app.db[i]:{name:'',stato:'',kcal:'',carbs:'',pro:'',fat:''};$('ft').textContent=i>=0?'Modifica alimento':'Nuovo alimento';$('dN').value=f.name;$('dS').value=f.stato||'';$('dK').value=f.kcal;$('dC').value=f.carbs;$('dP').value=f.pro;$('dF').value=f.fat;$('ocrS').textContent='';$('ocrT').textContent='';$('dDel').style.display=i>=0?'':'none';show('of',1)}
function saveDb(){const name=$('dN').value.trim();if(!name)return alert("Inserisci il nome dell'alimento.");const o={name,stato:$('dS').value,kcal:num($('dK').value),carbs:num($('dC').value),pro:num($('dP').value),fat:num($('dF').value)};
if(editIdx>=0)app.db[editIdx]=o;else{const x=app.db.findIndex(f=>norm(f.name)===norm(name));x>=0?app.db[x]=o:app.db.push(o)}
save();show('of',0);renderDb();if(view==='plan')renderMeals()}
function delDb(){if(editIdx<0||!confirm('Eliminare "'+app.db[editIdx].name+'" dall\'archivio? Gli alimenti già nei piani resteranno con gli ultimi valori calcolati.'))return;app.db.splice(editIdx,1);save();show('of',0);renderDb()}
const loadScript=u=>new Promise((ok,ko)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>ko(new Error('Lettore OCR non raggiungibile: serve la connessione internet.'));document.head.appendChild(e)});
function parseLabel(t){const L=t.replace(/\|/g,' ').replace(/,/g,'.').split('\n'),ex=/di cui|satur|gesätt|gesatt|mono|poli|zuccher|sugar|sucre|az[uú]car|zucker|a[cç][uú]car|amido|starch|davon|dont|of which|trans/i;
const num1=(l,re)=>{const q=(l.replace(re,'|').split('|')[1]||'').match(/\d+(\.\d+)?/);return q?parseFloat(q[0]):null};
const main=re=>{for(const l of L)if(re.test(l)&&!ex.test(l)){const v=num1(l,re);if(v!=null)return v}return null};
const T=L.join(' '),km=T.match(/(\d+(?:\.\d+)?)\s*kcal/i),kj=T.match(/(\d+(?:\.\d+)?)\s*kj/i),cm=T.match(/calor\w*\D{0,12}(\d+(?:\.\d+)?)\b(?!\s*g)/i);
return{kcal:km?parseFloat(km[1]):kj?Math.round(parseFloat(kj[1])/4.184):cm?parseFloat(cm[1]):null,carbs:main(/carboidrat\w*|glucid\w*|carbohydrat\w*|carbs|hidrat\w*|carbohidrat\w*|kohlenhydrat\w*/i),pro:main(/prot[eé]\w*|eiwe\w*/i),fat:main(/gras\w*|\bfats?\b|l[ií]pid\w*|fett\w*|gordur\w*/i)}}
async function readLabel(inp){const f=inp.files[0];inp.value='';if(!f)return;const st=$('ocrS');
try{st.textContent='Carico il lettore OCR…';if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
const im=await createImageBitmap(f),k=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.4)';x.drawImage(im,0,0,c.width,c.height);
const r=await Tesseract.recognize(c,$('ocrL').value,{logger:m=>{if(m.status==='recognizing text')st.textContent='Lettura… '+Math.round(m.progress*100)+'%'}});
$('ocrT').textContent=r.data.text;const v=parseLabel(r.data.text);
[['dK','kcal'],['dC','carbs'],['dP','pro'],['dF','fat']].forEach(([i,key])=>$(i).value=v[key]==null?'':v[key]);
const miss=MK.filter(key=>v[key]==null).map(key=>L[key]);
let m='Valori per 100 g letti: controllali prima di salvare.';
if(miss.length)m='Non ho trovato: '+miss.join(', ')+'. Completa a mano.';
else if(Math.abs(v.kcal-(v.carbs*4+v.pro*4+v.fat*9))>Math.max(25,v.kcal*.15))m='⚠ kcal e macro non tornano: probabile errore di lettura, ricontrolla.';
st.textContent=m;$('dN').focus()}catch(e){st.textContent='Errore: '+e.message}}
go('home');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
